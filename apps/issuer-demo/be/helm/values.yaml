# Default values for the DTK Issuer Demo backend.

## Deployment

annotations:

replicaCount: 1

image:
  # Required. Set to your own registry, e.g. --set image.repository=... --set image.tag=...
  repository:
  pullPolicy:
  tag:

# Environment variables sourced from a Kubernetes Secret.
# Shape: <ENV_VAR_NAME>: { k8s_secret_name: <name>, k8s_secret_key: <key> }
secretEnv: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

topologySpreadConstraints: []

# The port the app listens on. Must match service.api.port.
env:
  PORT: "3200"

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 256Mi

## Service Account

serviceAccount:
  create: false
  # The app never calls the Kubernetes API.
  automount: false

## Service

service:
  type: ClusterIP
  api:
    port: 3200
    targetPort: 3200
    portName: api

## Ingress

ingress:
  enabled: false
  host: ""
  paths:
  - path: /offers
    pathType: Prefix
  - path: /attribute-provider
    pathType: Prefix

## Horizontal Pod Autoscaler

autoscaling:
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: 3200
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /health
    port: 3200
  initialDelaySeconds: 20
  periodSeconds: 20

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  # minAvailable: 1  # set one or the other, never both
  unhealthyPodEvictionPolicy: AlwaysAllow
